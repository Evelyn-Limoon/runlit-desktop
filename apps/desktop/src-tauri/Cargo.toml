[package]
name = "runlit-desktop"
version = "0.1.0"
description = "Runlit desktop task observer"
authors = ["Runlit contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "runlit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
