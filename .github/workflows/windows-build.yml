name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Validate release workflow policy
        run: npm run preflight:release
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build
      - name: Prepare native bundle resources
        run: npm run prepare:bundle
      - name: Test native window logic
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Smoke-test the real daemon entrypoint
        shell: pwsh
        run: |
          $env:RUNLIT_CODEX_ADAPTER = '0'
          $daemon = Start-Process node -ArgumentList 'apps/daemon/dist/index.js' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt += 1) {
              Start-Sleep -Milliseconds 200
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:47831/health' -TimeoutSec 2
                if ($health.service -eq 'runlit-daemon') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw 'RunLit daemon smoke test failed.' }
          } finally {
            if (-not $daemon.HasExited) { Stop-Process -Id $daemon.Id -Force }
          }
      - name: Build Windows bundles
        run: npm run tauri -- build
      - name: Smoke-test the bundled daemon runtime
        shell: pwsh
        run: |
          $env:RUNLIT_PORT = '47839'
          $env:RUNLIT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'runlit-bundle-smoke'
          $env:RUNLIT_CODEX_ADAPTER = '0'
          $runtime = 'apps/desktop/src-tauri/target/release/resources/runtime/node.exe'
          $daemonEntry = 'apps/desktop/src-tauri/target/release/resources/daemon/runlit-daemon.cjs'
          $daemon = Start-Process $runtime -ArgumentList (Split-Path $daemonEntry -Leaf) -WorkingDirectory (Split-Path $daemonEntry) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt += 1) {
              Start-Sleep -Milliseconds 200
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:47839/health' -TimeoutSec 2
                if ($health.service -eq 'runlit-daemon') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw 'Bundled RunLit daemon smoke test failed.' }
          } finally {
            if (-not $daemon.HasExited) { Stop-Process -Id $daemon.Id -Force }
          }
      - name: Clean-runner install, launch, exit, and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-release-smoke.ps1 -SetupPath (Resolve-Path 'apps/desktop/src-tauri/target/release/bundle/nsis/Runlit_*-setup.exe').Path
      - uses: actions/upload-artifact@v4
        with:
          name: runlit-windows-native-bundle
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
